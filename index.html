<script>
// ═══════════════════════════════════════════════════════════════
// PUBLIC LIVE BOARD — reads a static results.json published by the
// admin tool to this same GitHub Pages site. No database, no API keys,
// no metered egress. GitHub Pages serves the JSON file directly.
//
// RESULTS_URL defaults to results.json sitting next to this file. A
// cache-busting query string is added at fetch time so updates show up
// promptly. Nothing secret lives in this file.
// ═══════════════════════════════════════════════════════════════
const RESULTS_URL = 'results.json';   // same folder as index.html
const REFRESH_MS  = 60000;            // re-check every 60s when tab is visible

// ── CONSTANTS ─────────────────────────────────────────────────
const DIST_TYPES=[
  {v:'walk',l:'Spacer/marsz',mult:0.5},
  {v:'bike',l:'Rower',       mult:0.3},
  {v:'swim',l:'Pływanie',    mult:5.0},
];
const ACT_CAP=75;
const TIME_FLAT=30;
const TIME_MIN=30;
// Kalendarz rozliczeniowy październik 2026 (§1.7). Tydzień 1 skrócony (cel 4), reszta cel 5.
const WEEK_DEFS=[
  {n:1, start:'2026-10-01', end:'2026-10-04', target:4},
  {n:2, start:'2026-10-05', end:'2026-10-11', target:5},
  {n:3, start:'2026-10-12', end:'2026-10-18', target:5},
  {n:4, start:'2026-10-19', end:'2026-10-25', target:5},
  {n:5, start:'2026-10-26', end:'2026-10-31', target:5},
];
function weekTarget(wn){ const w=WEEK_DEFS.find(x=>x.n===wn); return w?w.target:5; }
function curWeekNum(){
  const now=new Date();
  const iso=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const wd=WEEK_DEFS.find(x=>iso>=x.start&&iso<=x.end);
  return wd?wd.n:2;   // poza październikiem zakładamy pełny tydzień (cel 5)
}
let DAY_TARGET=5;     // ustawiany dynamicznie wg bieżącego tygodnia
const MISS_PENALTY=20;
const ROWER_MIN=8;    // minimum km dla roweru i roweru stacjonarnego (8 km)
const RUN_MIN=3;      // minimum km dla biegu
const WALK_MIN=3;     // minimum km dla spaceru
const SWIM_MIN=0.8;   // minimum km dla pływania (800 m)
const GPS_TOL=0.05;   // 5% tolerancji błędu GPS — liczy się od 95% minimum
function meetsMin(km,min){ return km >= min*(1-GPS_TOL); }
function timeTierPts(dur){ if(dur<TIME_MIN) return 0; return dur>=50?40:25; } // 30–49 min=25, 50+=40
// Kara finalna dopiero po zamknięciu tygodnia. Bieżący tydzień liczony bez kary
// (pokazujemy postęp). Zamknięte tygodnie mają karę wliczoną w snapshot.
let _applyPenalty=false;
const TEAM_POOL=600;
const ICONS={walk:'🚶',bike:'🚴',swim:'🏊',gym:'🏋️',yoga:'🧘',dance:'💃',fight:'⚔️',other:'💪'};
const LN={walk:'Spacer',bike:'Rower',swim:'Pływanie',gym:'Siłownia',yoga:'Joga/Pilates',dance:'Taniec',fight:'Walki',other:'Trening'};
const DAY_FULL=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
const DAY_SH=['Pn','Wt','Śr','Cz','Pt','Sb','Nd'];

function emptyDays(){return Array(7).fill(null).map(()=>({runs:[],distActs:[],timeActs:[]}));}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── SCORING (zasady od lipca 2026 — same rules as tabela_admin.html) ────
function distMult(type){return(DIST_TYPES.find(d=>d.v===type)||{mult:0}).mult;}

function calcDay(d){
  const validRuns=(d.runs||[]).filter(r=>meetsMin(r.km,RUN_MIN));
  const hasRun=validRuns.length>0;
  const runKm=validRuns.reduce((s,r)=>s+r.km,0);
  const runPts=Math.min(ACT_CAP, Math.round(runKm*5*10)/10);
  const dists=(d.distActs||[]).filter(a=>a.type==='walk'?meetsMin(a.km,WALK_MIN):a.type==='bike'?meetsMin(a.km,ROWER_MIN):a.type==='swim'?meetsMin(a.km,SWIM_MIN):a.km>0);
  const hasDistAct=dists.length>0;
  let distPts=0;
  ['walk','bike','swim'].forEach(tp=>{
    const km=dists.filter(a=>a.type===tp).reduce((s,a)=>s+a.km,0);
    if(km>0) distPts+=Math.min(ACT_CAP, Math.round(km*distMult(tp)*5*10)/10);
  });
  distPts=Math.round(distPts*10)/10;
  const validTimes=(d.timeActs||[]).filter(a=>a.dur>=TIME_MIN);
  const hasTimeAct=validTimes.length>0;
  const longestDur=hasTimeAct?Math.max.apply(null,validTimes.map(a=>a.dur)):0;
  const timePtsTotal=hasTimeAct?timeTierPts(longestDur):0;
  const timeActsTotal=validTimes.length;
  const timeActsUsed=hasTimeAct?1:0;
  const timeOverLimit=timeActsTotal>1;
  const hasAny=hasRun||hasDistAct||hasTimeAct;
  if(!hasAny)return{pts:0,hasRun,hasDistAct,hasTimeAct,runKm,runPts:0,distPts:0,timePts:0,timeActsUsed:0,timeActsTotal:0,timeOverLimit:false};
  const pts=20+runPts+distPts+timePtsTotal;
  return{pts:Math.round(pts*10)/10,hasRun,hasDistAct,hasTimeAct,runKm,
         runPts,distPts,timePts:timePtsTotal,timeActsUsed,timeActsTotal,timeOverLimit};
}

function calcMember(memberId, state, isDsq){
  const days=state[memberId]||emptyDays();
  const dayBreakdown=days.map(d=>calcDay(d));
  const idx=dayBreakdown.map((dc,i)=>({i,pts:dc.pts}))
                        .filter(o=>o.pts>0)
                        .sort((a,b)=>b.pts-a.pts);
  // §4.1: Tydzień 1 liczy maks 4 dni, Tygodnie 2–5 liczą 5 najlepszych (DAY_TARGET).
  const countedSet=new Set(idx.slice(0,DAY_TARGET).map(o=>o.i));
  dayBreakdown.forEach((dc,i)=>{ dc.counted=countedSet.has(i); });
  let dailyPts=0,totalKm=0,runDays=0,activeDays=0,timeActCount=0;
  let runDaysAll=0, activeDaysAll=0;   // §4.2/§6.1: z całego tygodnia
  dayBreakdown.forEach((dc,i)=>{
    timeActCount+=(days[i].timeActs||[]).filter(a=>a.dur>=TIME_MIN).length;
    if(dc.pts>0)activeDaysAll++;
    if(dc.hasRun)runDaysAll++;
    if(!dc.counted) return;
    if(dc.pts>0)activeDays++;
    if(dc.hasRun){runDays++;totalKm+=dc.runKm;}
    dailyPts+=dc.pts;
  });
  const regBonus=0; // bonus regularności usunięty (październik 2026)
  // §4.2: bonus biegowy liczy WSZYSTKIE dni z biegiem w tygodniu (nie tylko wliczone).
  const runBonus=runDaysAll>=4?50:runDaysAll>=3?25:runDaysAll>=2?10:0;
  let maxInactiveStreak=0, _run=0;
  dayBreakdown.forEach(dc=>{ if(dc.pts>0){_run=0;} else {_run++; if(_run>maxInactiveStreak)maxInactiveStreak=_run;} });
  const missDays=Math.max(0,DAY_TARGET-Math.min(DAY_TARGET,activeDays));
  // DSQ: punkty ujemne się kasują (kara=0), dodatnie zostają.
  const penalty=isDsq?0:missDays*MISS_PENALTY;
  const penaltyApplied=_applyPenalty?penalty:0;
  const rawTotal=dailyPts+regBonus+runBonus;
  const total=Math.max(0,Math.round(rawTotal-penaltyApplied));
  return{dailyPts,regBonus,runBonus,penalty,penaltyApplied,missDays,maxInactiveStreak,rawTotal:Math.round(rawTotal),total,totalKm:Math.round(totalKm*10)/10,runDays,runDaysAll,activeDays,activeDaysAll,timeActCount,dayBreakdown,dsq:!!isDsq};
}

function teamBonusPct(active, full){
  if(full<=0) return 0;
  const r=active/full;
  if(r>=0.80) return 1.00;
  if(r>=0.70) return 0.75;
  if(r>=0.60) return 0.50;
  if(r>=0.45) return 0.25;
  return 0;
}

function calcTeam(members, state){
  // Wszyscy członkowie (z DSQ) — potrzebni do fullDays (komplet zostaje pierwotny).
  const allResults=members.map(m=>({...m,...calcMember(m.id,state,m.dsq)}));
  // Do punktacji drużyny liczą się tylko NIE-DSQ.
  const active=allResults.filter(m=>!m.dsq);
  const cap=active.length?2/active.length:0;
  active.sort((a,b)=>b.total-a.total);
  const rawSum=active.reduce((s,m)=>s+m.total,0);
  const capPts=rawSum*cap;
  active.forEach(m=>{ m.contribution=Math.min(m.total,capPts); m.capped=m.total>capPts+0.5; });
  const cappedSum=Math.round(active.reduce((s,m)=>s+m.contribution,0));
  const activeDaysSum=active.reduce((s,m)=>s+Math.min(DAY_TARGET,m.activeDaysAll),0);
  const fullDays=members.length*DAY_TARGET;        // komplet = pierwotna liczba osób × cel tygodnia (§2.4)
  const teamPct=teamBonusPct(activeDaysSum,fullDays);
  const teamBonusTotal=Math.round(TEAM_POOL*teamPct);

  // Rozdział bonusu drużynowego RÓWNO na nie-DSQ członków, którzy coś wnieśli (activeDays>0).
  const share=active.filter(m=>m.activeDays>0);
  const per=share.length?Math.floor(teamBonusTotal/share.length):0;
  let rem=teamBonusTotal-per*share.length;         // reszta z dzielenia → do pierwszych osób
  // dsq i nieaktywni: 0 bonusu
  allResults.forEach(m=>{ m.teamBonusShare=0; });
  share.forEach((m,i)=>{ m.teamBonusShare=per+(i<rem?1:0); });

  return{results:allResults,active,grandTotal:Math.round(cappedSum)+teamBonusTotal,
         cappedSum:Math.round(cappedSum),teamBonusTotal,teamPct,activeDaysSum,fullDays,
         dsqCount:allResults.length-active.length};
}

// ── RENDER (adapted from tabela_admin.html exportResults) ──────
function renderApp(payload){
  const members=(payload&&payload.members)||[];
  if(!members.length){
    document.getElementById('app').innerHTML='<div class="center-msg">Brak opublikowanych danych jeszcze. Poczekaj aż admin zapisze wyniki.</div>';
    return;
  }
  const state=payload.state||{};
  const teamConfig=payload.teamConfig||{A:{},B:{}};
  const lockedWeeks=payload.lockedWeeks||[];
  const challengeStart=payload.challengeStart||'';
  const lastUpdated=payload.lastUpdated||null;

  DAY_TARGET=weekTarget((payload&&payload.currentWeek)||curWeekNum());   // cel bieżącego tygodnia
  const TEAM_A=members.filter(m=>m.team==='A');
  const TEAM_B=members.filter(m=>m.team==='B');
  const tA=calcTeam(TEAM_A,state);
  const tB=calcTeam(TEAM_B,state);

  const lockedA=lockedWeeks.reduce((s,w)=>s+(w.teamA&&w.teamA.grandTotal||0),0);
  const lockedB=lockedWeeks.reduce((s,w)=>s+(w.teamB&&w.teamB.grandTotal||0),0);
  tA.weekTotal=tA.grandTotal;
  tB.weekTotal=tB.grandTotal;
  tA.grandTotal=tA.grandTotal+lockedA;
  tB.grandTotal=tB.grandTotal+lockedB;

  const now=new Date();
  const cfgA=teamConfig.A||{};const cfgB=teamConfig.B||{};
  const tnA=cfgA.name||'Drużyna A';const tnB=cfgB.name||'Drużyna B';
  const logoA=cfgA.logoImg?'<img src="'+cfgA.logoImg+'" style="width:40px;height:40px;border-radius:8px;object-fit:cover;vertical-align:middle">':'<span style="font-size:1.6rem">'+(cfgA.logo||'🔴')+'</span>';
  const logoB=cfgB.logoImg?'<img src="'+cfgB.logoImg+'" style="width:40px;height:40px;border-radius:8px;object-fit:cover;vertical-align:middle">':'<span style="font-size:1.6rem">'+(cfgB.logo||'🔵')+'</span>';
  const updDate=lastUpdated?new Date(lastUpdated).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
  const refreshDate=now.toLocaleString('pl-PL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  let wn, weekRange='';
  if(challengeStart){
    const cs=new Date(challengeStart+' 12:00');
    const daysDiff=Math.floor((now-cs)/(24*60*60*1000));
    wn=Math.max(1,Math.floor(daysDiff/7)+1);
    const wkStart=new Date(cs.getTime()+(wn-1)*7*24*60*60*1000);
    const wkEnd=new Date(wkStart.getTime()+6*24*60*60*1000);
    const fmtD=d=>d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'});
    const fmtDY=d=>d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});
    weekRange=fmtD(wkStart)+' – '+fmtDY(wkEnd);
  }else{
    wn=Math.ceil((now-new Date(now.getFullYear(),0,1))/604800000);
  }

  function dayDots(breakdown){
    return (breakdown||[]).map((d,i)=>{
      if(!d||d.pts===0)return '<span style="color:#ddd">'+DAY_SH[i]+'</span>';
      const c=d.hasRun?'#e8553d':d.hasDistAct?'#3068b8':'#2d8a56';
      return '<span style="color:'+c+';font-weight:700">'+DAY_SH[i]+'</span>';
    }).join(' ');
  }

  function actDetail(d, dc){
    if(!d) return '<div style="color:#ccc;font-size:.78rem;font-style:italic;padding:.3rem 0">Brak aktywności</div>';
    const runs=(d.runs||[]).filter(r=>r.km>=3);
    const dists=(d.distActs||[]).filter(a=>a.type==='walk'?a.km>=3:a.type==='bike'?a.km>=ROWER_MIN:a.km>0);
    const allTimes=(d.timeActs||[]).filter(a=>a.dur>=30);
    if(!runs.length&&!dists.length&&!allTimes.length)
      return '<div style="color:#ccc;font-size:.78rem;font-style:italic;padding:.3rem 0">Brak aktywności</div>';
    const rowS='font-size:.8rem;line-height:1.7';
    let out='';
    out+='<div style="'+rowS+'">🎁 <b>Bonus dzienny: +20 pkt</b> <span style="color:#999">(raz za aktywny dzień)</span></div>';
    if(runs.length){
      const km=runs.reduce((s,r)=>s+r.km,0);
      const raw=Math.round(km*5*10)/10; const pts=Math.min(75,raw);
      const capNote=raw>75?' <span style="color:#b06a00">(limit 75)</span>':'';
      out+='<div style="'+rowS+'">🏃 Bieg <b>'+Math.round(km*10)/10+' km</b> → <b style="color:#e8553d">+'+pts+' pkt</b>'+capNote+'</div>';
    }
    ['walk','bike','swim'].forEach(tp=>{
      const items=dists.filter(a=>a.type===tp);
      if(!items.length) return;
      const km=items.reduce((s,a)=>s+a.km,0);
      const mult=distMult(tp); const raw=Math.round(km*mult*5*10)/10; const pts=Math.min(75,raw);
      const capNote=raw>75?' <span style="color:#b06a00">(limit 75)</span>':'';
      const ic=ICONS[tp]||'🏃';
      out+='<div style="'+rowS+'">'+ic+' '+(LN[tp]||tp)+' <b>'+Math.round(km*10)/10+' km</b> (×'+mult+') = <b style="color:#3068b8">+'+pts+' pkt</b>'+capNote+'</div>';
    });
    if(allTimes.length){
      const longest=allTimes.slice().sort((a,b)=>b.dur-a.dur)[0];
      const ic=ICONS[longest.type]||'💪';
      out+='<div style="'+rowS+'">'+ic+' '+(LN[longest.type]||longest.type)+' <b>'+longest.dur+' min</b> → <b style="color:#2d8a56">+'+timeTierPts(longest.dur)+' pkt</b></div>';
      if(allTimes.length>1)
        out+='<div style="'+rowS+';color:#bbb">+ '+(allTimes.length-1)+' inne treningi czasowe → 0 pkt (liczy się 1 dziennie)</div>';
    }
    const notCounted=dc&&dc.counted===false;
    out+='<div style="font-size:.8rem;font-weight:700;margin-top:.35rem;padding-top:.3rem;border-top:1px dashed #e8e2da">Razem dzień: '+Math.round(dc?dc.pts:0)+' pkt'
      +(notCounted?' <span style="color:#b06a00;font-weight:400">(poza top-5 dni)</span>':'')+'</div>';
    return out;
  }

  function unifiedTable(){

  // Chronicle helpers
  function mTimeMin(m){return(state[m.id]||[]).reduce((s,d)=>s+(d.timeActs||[]).filter(a=>a.dur>=30).reduce((ss,a)=>ss+a.dur,0),0);}

  function mBestDayPts(m){return Math.max(0,...(m.dayBreakdown||[]).map(d=>d.pts||0));}

  const allMAll=[...tA.results,...tB.results];
  const globalBestPts=Math.max(0,...allMAll.map(mBestDayPts));

  const raceData=[];let rcA=0,rcB=0;
  for(let di=0;di<7;di++){
    let dA=0,dB=0,actA=0,actB=0;
    tA.results.forEach(m=>{const dc=(m.dayBreakdown||[])[di];if(dc&&dc.pts>0){dA+=dc.pts;actA++;}});
    tB.results.forEach(m=>{const dc=(m.dayBreakdown||[])[di];if(dc&&dc.pts>0){dB+=dc.pts;actB++;}});
    const pA=actA/tA.results.length,pB=actB/tB.results.length;
    const bonA=pA>=1?120:pA>=0.8?90:pA>=0.6?60:pA>=0.4?30:0;
    const bonB=pB>=1?120:pB>=0.8?90:pB>=0.6?60:pB>=0.4?30:0;
    rcA+=Math.round(dA)+bonA;rcB+=Math.round(dB)+bonB;
    raceData.push({di,cumA:rcA,cumB:rcB,addA:Math.round(dA)+bonA,addB:Math.round(dB)+bonB,actA,actB});
  }
  const raceMax=Math.max(rcA,rcB,1);

  const totalActive=allMAll.filter(m=>m.activeDays>0).length;

  function chrDayHtml(di){

    let txt='';

    if(actA.length===tA.results.length)txt+='<strong style="color:#c8392b">'+esc(tnA)+' 100% aktywna! 💯</strong> ';
    if(actB.length===tB.results.length)txt+='<strong style="color:#1a5fa8">'+esc(tnB)+' 100% aktywna! 💯</strong> ';
    txt+='Najlepiej: <strong>'+esc(top.m.name)+'</strong> ('+topTm+') — '+Math.round(top.pts)+' pkt. ';
    if(runners.length>0&&runners[0].km>=5)txt+='Najdłuższy bieg: <strong>'+esc(runners[0].m.name)+'</strong> '+runners[0].km+' km. ';

      txt+='Tuż za nim(nią) '+esc(second.m.name)+' ('+s2tm+') z '+Math.round(second.pts)+' pkt.';
    }
    const dayColor=actA.length>actB.length?'#c8392b':actB.length>actA.length?'#1a5fa8':'#7a7068';
    return '<div class="chr-day">'
      +'<div class="chr-dn" style="color:'+dayColor+'">'+dayName+'</div>'
      +'<div class="chr-txt">'+txt+'</div></div>';
  }

  let leadA=0,leadB=0,ties=0;
  raceData.forEach(({cumA,cumB})=>{ if(cumA>cumB)leadA++; else if(cumB>cumA)leadB++; else ties++; });
  const winnerTeam=tA.weekTotal>tB.weekTotal?esc(tnA):tB.weekTotal>tA.weekTotal?esc(tnB):'żadna z drużyn';
  const diffFinal=Math.abs(tA.weekTotal-tB.weekTotal);

  const chronicleHtml='<div style="padding:.75rem">'
    +'<div style="background:#1e1a17;color:#fff;border-radius:12px;padding:.85rem 1rem;margin-bottom:.85rem">'
    +'<div style="font-weight:900;font-size:1.1rem">📖 Kronika Tygodnia '+wn+'</div>'
    +'<div style="font-size:.72rem;opacity:.6;margin-top:2px">Ostatnia aktualizacja danych: '+updDate+'</div>'
    +'</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:0;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:.85rem;box-shadow:0 1px 4px rgba(0,0,0,.07)">'
    +'<div style="flex:1;min-width:90px;padding:.65rem .75rem;border-right:1px solid #f0ede8;text-align:center">'
    +'<div style="font-size:.6rem;color:#999">👥 Aktywni</div><div style="font-weight:800;font-size:1rem">'+totalActive+'/'+allMAll.length+'</div></div>'
    +'<div style="flex:1;min-width:90px;padding:.65rem .75rem;border-right:1px solid #f0ede8;text-align:center">'
    +'<div style="font-size:.6rem;color:#999">💪 Aktywności</div><div style="font-weight:800;font-size:1rem">'+totalActs+'</div></div>'
    +'<div style="flex:1;min-width:90px;padding:.65rem .75rem;border-right:1px solid #f0ede8;text-align:center">'
    +'<div style="font-size:.6rem;color:#999">🏃 Km łącznie</div><div style="font-weight:800;font-size:1rem">'+totalKmAll+'</div></div>'
    +'<div style="flex:1;min-width:90px;padding:.65rem .75rem;text-align:center">'
    +'<div style="font-size:.6rem;color:#999">📅 Prow. dni</div>'
    +'<div style="font-weight:800;font-size:.85rem"><span style="color:#c8392b">A:'+leadA+'</span> <span style="color:#999">·</span> <span style="color:#1a5fa8">B:'+leadB+'</span></div></div>'
    +'</div>'
    +'<div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:.85rem">'
    +Array.from({length:7},(_,i)=>chrDayHtml(i)).join('')
    +'</div>'
    +'<div style="background:#fff;border-radius:12px;padding:.75rem;font-size:.82rem;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.07)">'
    +'<strong>Podsumowanie:</strong> '
    +(diffFinal===0
      ? 'Remis! Obie drużyny zakończyły tydzień z takim samym wynikiem — '+tA.weekTotal+' pkt. 🤝'
      : 'Tydzień wygrywa <strong>'+winnerTeam+'</strong> przewagą '+diffFinal+' pkt '
        +'('+Math.max(tA.weekTotal,tB.weekTotal)+' vs '+Math.min(tA.weekTotal,tB.weekTotal)+').'
    )
    +'</div>'
    +'</div>';

  const raceHtml='<div class="race-section">'
    +'<div style="font-weight:700;font-size:.95rem;margin-bottom:.65rem">📈 Wyścig dzień po dniu</div>'
    +raceData.map(function(rd){
      const wA=Math.max(Math.round(rd.cumA/raceMax*100),3);
      const wB=Math.max(Math.round(rd.cumB/raceMax*100),3);
      const lead=rd.cumA>rd.cumB?esc(tnA)+' +' +(rd.cumA-rd.cumB)+' pkt':rd.cumA<rd.cumB?esc(tnB)+' +'+(rd.cumB-rd.cumA)+' pkt':'Remis!';
      const lc=rd.cumA>rd.cumB?'#c8392b':rd.cumA<rd.cumB?'#1a5fa8':'#7a7068';
      return '<div class="race-day">'
        +'<div class="race-day-label">'+DAY_FULL[rd.di]
        +'<span style="font-weight:400;color:#999;margin:0 6px">+'+rd.addA+' vs +'+rd.addB+'</span>'
        +'<span style="color:'+lc+';font-style:italic">'+lead+'</span></div>'
        +'<div class="race-bar" style="background:#c8392b;width:'+wA+'%">'+esc(tnA)+' · '+rd.cumA+'</div>'
        +'<div class="race-bar" style="background:#1a5fa8;width:'+wB+'%">'+esc(tnB)+' · '+rd.cumB+'</div>'
        +'</div>';
    }).join('')
    +'</div>';

  // Achievements
  function awardCard(emoji,title,winner,detail,col){
    if(!winner)return'';
    return '<div class="aw-card">'
      +'<div class="aw-icon" style="background:'+col+'22;color:'+col+'">'+emoji+'</div>'
      +'<div class="aw-body">'
      +'<div class="aw-title">'+esc(title)+'</div>'
      +'<div class="aw-winner">'+esc(winner)+'</div>'
      +'<div class="aw-detail">'+esc(detail)+'</div>'
      +'</div></div>';
  }

  function teamAwards(td,col,tname,logo){
    const ms=td.results;
    const mvp=ms.slice().sort((a,b)=>b.contribution-a.contribution)[0];
    const runner=ms.filter(m=>m.totalKm>0).sort((a,b)=>b.totalKm-a.totalKm)[0];
    const endure=ms.slice().sort((a,b)=>b.activeDays-a.activeDays||b.total-a.total)[0];
    const trainer=ms.filter(m=>mTimeMin(m)>0).sort((a,b)=>mTimeMin(b)-mTimeMin(a))[0];
    const bestDayM=ms.filter(m=>mBestDayPts(m)>0).sort((a,b)=>mBestDayPts(b)-mBestDayPts(a))[0];
    const swimmer=ms.filter(m=>mSwimKm(m)>0).sort((a,b)=>mSwimKm(b)-mSwimKm(a))[0];
    const cyclist=ms.filter(m=>mBikeKm(m)>0).sort((a,b)=>mBikeKm(b)-mBikeKm(a))[0];
    const walker=ms.filter(m=>mWalkKm(m)>0).sort((a,b)=>mWalkKm(b)-mWalkKm(a))[0];

    let h='<div class="aw-team"><div class="aw-team-hdr" style="background:'+col+'">';
    h+=logo+'<span style="font-weight:900;font-size:1rem;margin-left:8px">'+esc(tname)+'</span>';
    h+='<span style="font-size:.78rem;opacity:.7;margin-left:auto">'+td.weekTotal+' pkt (tydzień)</span></div>';
    h+='<div class="aw-cards">';
    if(mvp)h+=awardCard('🥇','Zawodnik tygodnia',mvp.name,Math.round(mvp.contribution)+' pkt wkładu do drużyny',col);
    if(runner&&runner.totalKm>=3)h+=awardCard('🏃','Biegacz tygodnia',runner.name,runner.totalKm+' km biegiem',col);
    if(endure&&endure.activeDays>=2){
      if(endure.activeDays>=(mvp?mvp.activeDays+1:1)||!mvp||endure.id!==mvp.id)
        h+=awardCard('📅','Najwytrwalszy(-a)',endure.name,endure.activeDays+' aktywnych dni w tygodniu',col);
    }
    if(trainer)h+=awardCard('💪','Trener tygodnia',trainer.name,mTimeMin(trainer)+' min treningów',col);
    if(bestDayM&&bestDayM!==mvp)h+=awardCard('⚡','Najlepszy dzień',bestDayM.name,Math.round(mBestDayPts(bestDayM))+' pkt w jednym dniu',col);
    if(swimmer)h+=awardCard('🏊','Pływak tygodnia',swimmer.name,Math.round(mSwimKm(swimmer)*10)/10+' km w basenie',col);
    if(cyclist)h+=awardCard('🚴','Rowerzysta tygodnia',cyclist.name,Math.round(mBikeKm(cyclist)*10)/10+' km na rowerze',col);
    if(walker)h+=awardCard('🚶','Spacerowicz tygodnia',walker.name,Math.round(mWalkKm(walker)*10)/10+' km spacerów',col);
    h+='</div></div>';
    return h;
  }

  const globalChamp=allMAll.slice().sort((a,b)=>b.total-a.total)[0];
  const globalChampTeam=tA.results.includes(globalChamp)?esc(tnA):esc(tnB);
  const globalBestDay=allMAll.filter(m=>mBestDayPts(m)===globalBestPts&&globalBestPts>0);

  const achHtml='<div style="padding:.75rem">'
    +'<div style="background:#1e1a17;color:#fff;border-radius:12px;padding:.85rem 1rem;margin-bottom:.85rem;display:flex;align-items:center;gap:12px">'
    +'<span style="font-size:2rem">🌟</span>'
    +'<div><div style="font-weight:900;font-size:1.05rem">Mistrz Tygodnia</div>'
    +'<div style="font-size:.9rem;opacity:.9"><strong>'+esc(globalChamp.name)+'</strong> ('+globalChampTeam+') — '+globalChamp.total+' pkt</div>'
    +(globalBestDay.length>0?'<div style="font-size:.72rem;opacity:.6;margin-top:2px">⚡ Rekord dnia: '+globalBestDay.map(m=>esc(m.name)).join(', ')+' — '+Math.round(globalBestPts)+' pkt</div>':'')
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:1fr;gap:.75rem">'
    +teamAwards(tA,'#c8392b',tnA,logoA)
    +teamAwards(tB,'#1a5fa8',tnB,logoB)
    +'</div>'
    +'</div>';

  // ── Sticky header ──
  const diff=tA.grandTotal-tB.grandTotal;
  const bannerTxt=diff===0?'🤝 Remis w klasyfikacji generalnej!'
    :(diff>0?'🏆 Prowadzi '+esc(tnA)+' +'+diff+' pkt (łącznie)'
            :'🏆 Prowadzi '+esc(tnB)+' +'+Math.abs(diff)+' pkt (łącznie)');

  document.getElementById('stickyInner').innerHTML=
    '<div class="sc">'+logoA
    +'<div><div class="sc-pts" style="color:#e8553d">'+tA.grandTotal+' pkt</div>'
    +'<div class="sc-name">'+esc(tnA)+'</div></div></div>'
    +'<div class="sc-vs">VS</div>'
    +'<div class="sc" style="justify-content:flex-end;text-align:right">'+logoB
    +'<div><div class="sc-pts" style="color:#3068b8">'+tB.grandTotal+' pkt</div>'
    +'<div class="sc-name">'+esc(tnB)+'</div></div></div>'
    +'<div class="live-indicator" id="liveIndicator" onclick="manualRefresh()">🟢 NA ŻYWO · odświeżono '+refreshDate+' (kliknij aby odświeżyć)</div>';

  // ── Main body ──
  document.getElementById('app').innerHTML=
    '<div class="info-bar">'
    +'<div class="info-box">'
    +'<b>Tydzień '+wn+'</b>'+(weekRange?' ('+weekRange+')':'')+' · Ostatnia aktualizacja danych: '+updDate
    +'<br><span style="color:#e8553d;font-weight:600">'+bannerTxt+'</span>'
    +'<br><span style="font-size:.73rem">⬇️ Dotknij zawodnika, aby sprawdzić czy Twoje aktywności zostały zapisane poprawnie. Strona aktualizuje się automatycznie po zmianach admina.</span>'
    +'</div></div>'
    +'<div class="tab-wrap">'
    +'<div class="tab-bar">'
    +'<label id="tb1" class="active" onclick="showTab(1)">🏆 Wyniki</label>'
    +'<label id="tb2" onclick="showTab(2)">👥 Drużyny</label>'
    +'<label id="tb3" onclick="showTab(3)">📊 Statystyki</label>'
    +'<label id="tb4" onclick="showTab(4)">🗓️ Tydzień</label>'
    +'<label id="tb5" onclick="showTab(5)">🏅 Osiągnięcia</label>'
    +'</div>'
    +'<div class="tab-pane active" id="px1">'
    +unifiedTable()
    +'<div style="text-align:center;font-size:.7rem;color:#bbb;padding:.5rem">Aktywny wrzesień 2026 · widok na żywo, tylko do odczytu</div>'
    +'</div>'
    +'<div class="tab-pane" id="px2">'
    +'<div class="teams-grid">'
    +teamSection('A',tA,'#c8392b','#fdecea',logoA,tnA)
    +teamSection('B',tB,'#1a5fa8','#e8f0fb',logoB,tnB)
    +'</div></div>'
    +'<div class="tab-pane" id="px3"><div style="padding:.75rem">'+statsHtml+'</div></div>'
    +'<div class="tab-pane" id="px4">'+chronicleHtml+raceHtml+'</div>'
    +'<div class="tab-pane" id="px5">'+achHtml+'</div>'
    +'</div>';

  // Re-apply the previously selected tab (innerHTML replace resets it to tab 1)
  showTab(currentTab);
}

// ── TAB SWITCHING (plain JS — replaces the CSS-radio trick, which
//    only works when the radios and .tab-wrap are direct siblings;
//    here .tab-wrap is injected inside #app) ─────────────────────
let currentTab=1;
function showTab(n){
  currentTab=n;
  for(let i=1;i<=5;i++){
    const pane=document.getElementById('px'+i);
    const btn=document.getElementById('tb'+i);
    if(pane) pane.classList.toggle('active', i===n);
    if(btn) btn.classList.toggle('active', i===n);
  }
}

// ── DATA LOADING (static results.json) ───────────────────────
let _lastStamp=null;   // lastUpdated of the data we currently show

async function fetchResults(){
  // Cache-bust so GitHub Pages / browser cache doesn't serve a stale copy
  const url=RESULTS_URL+'?t='+Date.now();
  const r=await fetch(url,{cache:'no-store'});
  if(r.status===404) return {missing:true};
  if(!r.ok) throw new Error('HTTP '+r.status);
  return {payload:await r.json()};
}

async function loadAndRender(){
  try{
    const res=await fetchResults();
    if(res.missing){
      document.getElementById('app').innerHTML='<div class="center-msg">Brak opublikowanych wyników jeszcze.<br><br>Pojawią się tutaj, gdy administrator pierwszy raz zapisze dane.</div>';
      return;
    }
    _lastStamp=res.payload?res.payload.lastUpdated:null;
    renderApp(res.payload);
  }catch(e){
    console.error('Load error:',e);
    document.getElementById('app').innerHTML='<div class="center-msg">⚠️ Nie udało się wczytać wyników. Sprawdź połączenie internetowe lub odśwież stronę.</div>';
  }
}

// Lightweight refresh: only re-render if the published data actually changed.
async function checkForUpdates(){
  if(document.hidden) return;     // do nothing while tab is in the background
  try{
    const res=await fetchResults();
    if(res.missing) return;
    const stamp=res.payload?res.payload.lastUpdated:null;
    if(stamp!==_lastStamp){
      _lastStamp=stamp;
      renderApp(res.payload);
    }
  }catch(e){ /* transient network error — ignore, try again next tick */ }
}

function manualRefresh(){
  const ind=document.getElementById('liveIndicator');
  if(ind)ind.textContent='⏳ Odświeżanie…';
  loadAndRender();
}

// ── INIT ─────────────────────────────────────────────────────
loadAndRender();                                  // initial load
setInterval(checkForUpdates, REFRESH_MS);         // periodic check (visible tabs only)
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkForUpdates(); });
</script>
